services:
  # 1. Database Service
  mongo:
    image: mongo:7
    container_name: shipshape-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # 2. Backend API Service
  backend:
    build: ./backend
    container_name: shipshape-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/shipshape
      - NODE_ENV=production
    depends_on:
      - mongo
    restart: unless-stopped

  # 3. Frontend Web Service
  frontend:
    build: ./frontend
    container_name: shipshape-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped

# Named volume to persist MongoDB data across container restarts
volumes:
  mongo_data:
